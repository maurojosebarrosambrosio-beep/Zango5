<!DOCTYPE html>
<html lang="pt-AO"><head><meta charset="utf-8">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ff6b00"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>ZANGO 5 MARKET - Kilapi Digital da Banda</title>
<style>
:root{--bg:#fff8ef;--card:#fff;--tx:#1b2a41;--mut:#6b7a90;--or:#ff7a00;--bl:#0b4f9c;--gr:#18a957;--bd:#f0dcc0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a2b;--card:#17243a;--tx:#f4efe6;--mut:#9fb0c8;--bd:#2a3b57}}
:root[data-theme="dark"]{--bg:#101a2b;--card:#17243a;--tx:#f4efe6;--mut:#9fb0c8;--bd:#2a3b57}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:72px}
main{max-width:640px;margin:auto;padding:12px}
header{background:linear-gradient(135deg,var(--or),var(--bl));color:#fff;padding:12px 14px;text-align:center}
header b{font-size:18px;display:block}header small{opacity:.95}
.hero{background:linear-gradient(135deg,var(--or),#ffb347);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.hero h2{margin:0 0 6px;font-size:19px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:800;color:#fff;background:var(--bl);cursor:pointer;text-align:center;text-decoration:none}
.btn.or{background:var(--or)}.btn.gr{background:var(--gr)}.btn.sm{padding:8px;font-size:13px;display:inline-block;width:auto;border-radius:10px}.btn.gh{background:transparent;color:var(--bl);border:2px solid var(--bl)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}.chip{flex:none;border:2px solid var(--bl);color:var(--bl);background:transparent;border-radius:20px;padding:6px 11px;font-weight:700;font-size:13px;cursor:pointer}.chip.on{background:var(--bl);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden}.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bd)}
.card div{padding:8px}.pr{color:var(--or);font-weight:900;font-size:17px}.mut{color:var(--mut);font-size:12.5px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--bd);border-radius:10px;margin:4px 0 10px;font:inherit;background:var(--bg);color:var(--tx)}
label{font-weight:700;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{position:relative;flex:1;border:0;background:none;padding:9px 0;font-size:11px;font-weight:700;color:var(--mut);cursor:pointer}nav button.on{color:var(--or)}nav span{display:block;font-size:20px}
.tag{display:inline-block;background:var(--bl);color:#fff;border-radius:8px;padding:2px 7px;font-size:11px;font-weight:700}.tag.o{background:var(--or)}.tag.r{background:#d33}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.av{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none!important}
.big{font-size:28px;font-weight:900;color:var(--or)}

.pic{cursor:zoom-in}
.pimg{width:100%;max-height:420px;object-fit:cover;border-radius:12px;display:block;cursor:zoom-in;background:var(--bd)}
.ph{display:flex;align-items:center;justify-content:center;background:var(--bd);font-size:22px}
.bdg{position:absolute;top:3px;left:56%;background:#d33;color:#fff;font-style:normal;font-size:10px;font-weight:800;border-radius:9px;padding:1px 5px}
.fab{position:fixed;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:20;border:0;border-radius:24px;padding:10px 14px;background:var(--bl);color:#fff;font-weight:800;font-size:13px;box-shadow:0 4px 14px #0004;cursor:pointer}
.chead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 4px;background:var(--bg);border-bottom:1px solid var(--bd)}
.chead>div{flex:1}
.msgs{display:flex;flex-direction:column;gap:6px;padding:10px 2px 84px}
.b{max-width:82%;padding:8px 11px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.b.me{align-self:flex-end;background:var(--or);color:#fff;border-bottom-right-radius:4px}
.b.th{align-self:flex-start;background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px}
.b small{display:block;font-size:10px;opacity:.7;text-align:right;margin-top:2px}
.cbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;z-index:6;display:flex;gap:8px;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd)}
.cbar input{flex:1;width:auto;margin:0;border-radius:20px}
details.box summary{cursor:pointer}
.lb{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lbt{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;color:#fff}
.lbt button{background:#fff3;border:0;color:#fff;font-size:20px;border-radius:50%;width:38px;height:38px;cursor:pointer}
.lbs{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;min-height:0}
.sl{flex:0 0 100%;scroll-snap-align:center;overflow:auto;display:flex;align-items:center;justify-content:center}
.sl img{max-width:100%;max-height:100%;object-fit:contain}
.sl.z{display:block}.sl.z img{max-width:none;max-height:none;width:220%}
.lbb{display:flex;gap:10px;align-items:center;justify-content:space-between;color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:#000}
</style></head><body>
<header><b>🌞 ZANGO 5 MARKET</b><small>Kilapi Digital da Banda · Aqui ninguém perde, 1000Kz te faz patrão!</small></header>
<main id="app">A carregar o bazar… 🛒</main>
<nav id="nav"></nav><button class="fab" id="fab" onclick="go('apoio')">🛟 Apoio</button>
<script>
const CATS=["Ngué Nguvulo (Comida) 🍲","Pano da Buala (Roupas) 👕","Babas e Mamis (Bebés) 🍼","Banga das Damas (Cabelo/Unhas) 💅","Mambos de Casa 🏠","Móveis e Eletro 🛋️","Biscates e Serviços 🔧","Canalizador 🚰","Eletricista ⚡","Técnico de Frio ❄️","Arrendamento de Casas 🏘️","Venda de Automóveis 🚗","Telemóveis e Informática 📱","Construção e Obras 🧱","Produtos Diversos 🛒"];
const S={view:'home',cat:-1,let:'',near:false,af:'pend',proofs:{},myB:null,apps:{},oks:{},shops:{},cfg:{},me:null,admin:false,db:null,pend:{},posts:[],chats:[],msgs:[],fd:{},cur:null,draft:'',vp:{},loja:null,tp:''};
const $=s=>document.getElementById(s),esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LET='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const BL=b=>'Bloco '+esc(b);
const pb=b=>{const m=/^([A-Za-z])\s*(\d{1,3})$/.exec(String(b||'').trim());return m?{l:m[1].toUpperCase(),n:+m[2]}:null};
const mine=()=>S.myB||(S.apps[S.me]||{}).bloco;
function dist(b){const a=pb(b),m=pb(mine());if(!a||!m)return 9999;return a.l===m.l?Math.abs(a.n-m.n):500+Math.abs(a.l.charCodeAt()-m.l.charCodeAt())*10}
const lopts=sel=>LET.map(l=>`<option value="${l}" ${sel==l?'selected':''}>${l}</option>`).join('');
const kz=n=>Number(n||0).toLocaleString('pt-PT')+' Kz';
const active=u=>S.oks[u]&&S.oks[u].state==='ativo'&&S.oks[u].until>Date.now();
const wa=n=>{n=String(n).replace(/\D/g,'');return 'https://wa.me/'+(n.length==9?'244'+n:n)};
function shrink(file,max=480,q=.6){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',q))};i.src=URL.createObjectURL(file)})}
async function pick(e,k){const f=e.target.files[0];if(f){S.pend[k]=await shrink(f,({proof:800,post:640})[k]||480);e.target.nextElementSibling.textContent='✅ Foto pronta!'}}
function go(v){document.activeElement&&document.activeElement.blur&&document.activeElement.blur();S.view=v;render();scrollTo(0,0)}
function items(){let a=[];for(const u in S.shops)if(active(u))(S.shops[u].items||[]).filter(i=>!i.sold).forEach(i=>a.push({...i,u}));return a.sort((x,y)=>y.ts-x.ts)}
function seller(u){return S.apps[u]||{}}
function card(i){const s=seller(i.u),d=dist(s.bloco),nb=mine()?(d==0?'<span class="tag">📍 No teu bloco</span> ':d<=3?'<span class="tag o">👣 Vizinho</span> ':''):'',tk=i.k==='servico'?'<span class="tag o">🔧 Serviço</span> ':i.k==='desapego'?'<span class="tag r">♻️ Desapego</span> ':'',vf=S.vp[i.id]?'<span class="tag" style="background:var(--gr)">✔ Verificado</span> ':'';return `<div class="card"><img class="pic" src="${esc(i.img)}" alt="" onclick="openPic('${sid(i.u)}','${sid(i.id)}')"><div><div class="pr">${kz(i.p)}<span style="float:right;font-size:18px;cursor:pointer"><span onclick="togFav('${sid(i.id)}')">${isFav(i.id)?'❤️':'🤍'}</span> <span onclick="shareProd('${sid(i.u)}','${sid(i.id)}')">🔗</span></span></div>${nb}${tk}${vf}${i.n>1?'<span class="tag">📷 '+i.n+' fotos</span> ':''}<b>${esc(i.t)}</b><div class="mut" style="cursor:pointer" onclick="verLoja('${sid(i.u)}')">🏪 ${esc(s.name)} - ${BL(s.bloco)} ${lvl(i.u).e} ${rt(i.u)}</div><button class="btn gr sm" style="margin-top:6px;width:100%" onclick="talk('${sid(i.u)}','${sid(i.id)}')">🤝 Negociar</button><div class="mut" style="text-align:center;margin-top:6px"><span style="cursor:pointer" onclick="report('ad','${sid(i.id)}','${sid(i.u)}')">🚩 Denunciar</span></div>${S.admin?`<button class="btn sm gh" style="width:100%;margin-top:6px" onclick="admDel('${sid(i.u)}','${sid(i.id)}')">🛡️ Remover (viola regras)</button>`:''}</div></div>`}
function home(){let L=items().filter(i=>(S.cat<0||i.c==S.cat)&&(!S.tp||(S.tp==='ver'?S.vp[i.id]:S.tp==='fav'?isFav(i.id):(i.k||'produto')===S.tp))&&(!S.let||(pb(seller(i.u).bloco)||{}).l===S.let)&&(!S.q||(i.t+' '+seller(i.u).name+' '+seller(i.u).sells).toLowerCase().includes(S.q)));if(S.near&&mine())L.sort((a,b)=>dist(seller(a.u).bloco)-dist(seller(b.u).bloco));const m=S.me&&S.apps[S.me];
return `<div class="hero"><h2>Cansaste de ir no Kikolo? 🛍️</h2>Vende e compra aqui no prédio! De Bloco A1 até Bloco Z200, tudo se vende aqui sem precisar apanhar táxi! Entrega a pé! 🚶</div>
${m?'':`<button class="btn or" onclick="S.fd.tipo='vendedor';go('join')">🔥 QUERO SER PATRÃO POR 1000KZ</button><button class="btn" style="margin-top:8px" onclick="S.fd.tipo='cliente';go('join')">🛍️ Sou cliente: cadastro 500 Kz</button><p class="mut" style="text-align:center">Com 1000Kz nem compras um frango, mas aqui compras clientes todo mês! Investimento que volta no primeiro cliente. 🤑</p>`}
<input id="qs" placeholder="🔍 Procurar bolo, tranças, gás…" value="${esc(S.q||'')}" style="margin:0 0 8px" oninput="S.q=this.value.toLowerCase();clearTimeout(window.qt);window.qt=setTimeout(()=>{document.activeElement.blur();render();$('qs').focus()},500)">${inst()}${daily()}<div class="chips">${[['','Tudo'],['produto','🛒 Produtos'],['servico','🔧 Serviços'],['desapego','♻️ Desapego'],['ver','✔ Verificados'],['fav','❤️ Favoritos']].map(c=>`<button class="chip ${S.tp==c[0]?'on':''}" onclick="S.tp='${c[0]}';render()">${c[1]}</button>`).join('')}</div><div class="chips"><button class="chip ${S.cat<0?'on':''}" onclick="S.cat=-1;render()">Tudo 🔥</button>${CATS.map((c,i)=>`<button class="chip ${S.cat==i?'on':''}" onclick="S.cat=${i};render()">${c}</button>`).join('')}</div>
<div class="row" style="margin-bottom:8px"><select style="margin:0" onchange="this.blur();S.let=this.value;render()"><option value="">Todos os blocos</option>${LET.map(l=>`<option value="${l}" ${S.let==l?'selected':''}>Todos os Bloco ${l}</option>`).join('')}</select><button class="chip ${S.near?'on':''}" onclick="S.near=!S.near;render()">📍 Perto de mim</button></div>
${S.near&&!mine()?`<div class="box row"><select id="m_l" style="margin:0">${lopts('A')}</select><input id="m_n" type="number" min="1" max="200" placeholder="1-200" style="margin:0"><button class="btn sm" onclick="setMy()">OK</button></div>`:S.near?`<p class="mut">Primeiro os do ${BL(mine())} e vizinhos 👣</p>`:''}
<div class="grid">${L.map(card).join('')||'<p class="mut" style="grid-column:1/3">Ainda está calmo por aqui, mano. Sê o primeiro patrão a postar! 😎</p>'}</div><p style="text-align:center;margin-top:24px"><a href="#" class="mut" onclick="go('admin');return false">🔒 Área do admin</a></p>`}
function setMy(){const n=+$('m_n').value;if(!(n>=1&&n<=200))return alert('Número de 1 a 200, mano!');S.myB=$('m_l').value+n;document.activeElement.blur();render()}
function loginBox(){return `<div class="box"><b>Entra no teu painel 🔑</b><p class="mut">Número + PIN de 6 dígitos, sem SMS. Para ver o bazar não precisa de entrar; para conversar com vendedores ou vender, sim.</p><label>Telemóvel</label><input id="l_t" type="tel" placeholder="9XX XXX XXX"><label>PIN (6 números)</label><input id="l_p" type="password" inputmode="numeric" maxlength="6"><button class="btn" onclick="doLogin(0)">Entrar</button><hr style="border:0;border-top:1px solid var(--bd);margin:14px 0"><b>Primeira vez? 🆕</b><label>Repete o PIN</label><input id="l_p2" type="password" inputmode="numeric" maxlength="6"><button class="btn or" onclick="doLogin(1)">Criar a minha conta</button><p class="mut">Guarda bem o PIN! Se esqueceres, fala com o admin.</p></div>`}
async function doLogin(nova){let t=$('l_t').value.replace(/\D/g,'');if(t.length==9)t='244'+t;const p=$('l_p').value;if(t.length<9||!/^\d{6}$/.test(p))return alert('Põe o teu número e um PIN de 6 números, mano!');if(nova&&p!==$('l_p2').value)return alert('Os dois PINs não são iguais 🤔');
try{await FB.login(t,p,nova)}catch(e){alert({'auth/email-already-in-use':'Esse número já tem conta. Usa o botão Entrar.','auth/invalid-credential':'Número ou PIN errado.','auth/operation-not-allowed':'O admin ainda não ativou Email/Senha no Firebase.','auth/too-many-requests':'Muitas tentativas. Espera uns minutos.'}[e.code]||'Erro: '+(e.code||e.message))}}
function join(){const m=S.apps[S.me],o=S.oks[S.me];
if(!S.me)return loginBox();
if(m)return `<div class="box"><b>Já mandaste os dados, ${esc(m.name)}! 🙌</b><p>${o&&o.state==='ativo'&&o.until>Date.now()?'Estás ATIVO ✅ Vai ao teu painel e posta!':o&&o.state==='recusado'?'O admin não aprovou o comprovativo. Fala com o apoio pelo chat.':'Estamos a confirmar o teu pagamento. Calma que já já és patrão ⏳'}</p><button class="btn" onclick="go('painel')">Ir ao meu painel</button></div>`;
const cl=(S.fd.tipo||'vendedor')==='cliente',fee=cl?500:1000;return `<div class="box"><div class="chips"><button class="chip ${cl?'':'on'}" onclick="S.fd.tipo='vendedor';render()">🧑‍💼 Vendedor · 1.000 Kz</button><button class="chip ${cl?'on':''}" onclick="S.fd.tipo='cliente';render()">🛍️ Cliente · 500 Kz</button></div><h3 style="margin-top:0">${cl?'Cadastro de cliente por 500Kz/mês 🛍️':'Vira patrão por 1000Kz/mês 💪'}</h3>
<label>Teu nome</label><input id="f_n"><label>Bloco (letra + número de 1 a 200)</label><div class="row"><select id="f_bl">${lopts('A')}</select><input id="f_bn" type="number" min="1" max="200" inputmode="numeric" placeholder="ex: 45"></div>
<label>Apartamento</label><input id="f_a" placeholder="ex: 3º andar, porta 12"><label>Telemóvel (para o admin)</label><input id="f_w" type="tel" placeholder="9XX XXX XXX">
${cl?'':'<label>O que vendes?</label><input id="f_s" placeholder="ex: bolos, tranças, gás, aluguer de casa…">'}<label>Foto de perfil</label><input type="file" accept="image/*" onchange="pick(event,'photo')"><div class="mut"></div><br>
<div class="box" style="background:var(--bg)"><b>💳 Pagamento: ${kz(fee)}</b><br>Multicaixa Express para: <b>${esc(S.cfg.num||'(o admin ainda vai pôr o número)')}</b> ${S.cfg.nome?'('+esc(S.cfg.nome)+')':''}<br><span class="mut">Paga e anexa o comprovativo aqui em baixo.</span></div>
<label>Comprovativo (print)</label><input type="file" accept="image/*" onchange="pick(event,'proof')"><div class="mut"></div><br>
<button class="btn or" onclick="sendJoin()">Mandar e esperar aprovação 🚀</button></div>`}
async function sendJoin(){const cl=(S.fd.tipo||'vendedor')==='cliente',g=i=>$(i)?$(i).value.trim():'';if(!g('f_n')||!g('f_w')||!S.pend.proof||(!cl&&(!g('f_s')||!S.pend.photo)))return alert(cl?'Falta qualquer coisa, mano! Preenche nome, telemóvel, bloco e põe o comprovativo 📸':'Falta qualquer coisa, mano! Preenche tudo e põe as 2 fotos 📸');
const bn=+g('f_bn');if(!(bn>=1&&bn<=200))return alert('O número do bloco é de 1 a 200, mano!');const bk=g('f_bl')+bn;try{await S.db.collection('apps').doc(S.me).set({name:g('f_n'),bloco:bk,apt:g('f_a'),wpp:g('f_w'),sells:g('f_s'),tipo:cl?'cliente':'vendedor',photo:S.pend.photo||NOPHOTO,ts:Date.now()});await S.db.collection('proofs').doc(S.me).set({img:S.pend.proof,ts:Date.now()});S.pend={};go('painel')}catch(e){alert('Deu erro: '+(e.message||e.code))}}
function painel(){const m=S.apps[S.me];if(!S.me)return loginBox();if(!m)return `<div class="box"><b>Ainda não tens cadastro 😅</b><button class="btn or" onclick="go('join')" style="margin-top:8px">Cadastrar agora</button></div><button class="btn sm gh" onclick="FB.out()">Sair da conta</button>`;
const it=(S.shops[S.me]||{}).items||[],sold=it.filter(i=>i.sold),tot=sold.reduce((a,i)=>a+Number(i.p),0),ok=active(S.me),cl=m.tipo==='cliente';
return `<div class="box row"><img class="av" src="${esc(m.photo)}" alt=""><div><b>${esc(m.name)}</b> · ${BL(m.bloco)}<br>${ok?'<span class="tag">'+(cl?'✅ Cliente Confirmado':'✅ Vendedor Confirmado do Zango 5')+'</span> <span class="mut">até '+new Date(S.oks[S.me].until).toLocaleDateString('pt-PT')+'</span>':'<span class="tag o">⏳ À espera de aprovação</span>'}</div></div>
${renew()}${cl?'':`<div class="box"><div class="mut">Nível: <b>${lvl(S.me).e} ${lvl(S.me).n}</b> · ${lvl(S.me).v} vendas${lvl(S.me).nx?' · próximo nível com '+lvl(S.me).nx+' vendas':''}</div><div class="mut" style="margin-top:8px">Calculadora ganha-ganha 🧮</div><div class="big">${(tot/1000).toFixed(1)}x</div>Já vendeste ${kz(tot)}${tot>=1000?`, ou seja, já lucraste <b>${Math.floor(tot/1000)} vezes</b> os 1000Kz! Mamo total! 🤑`:'. Faz a primeira venda e o teu investimento já volta! 💪'}<div class="row" style="margin-top:10px"><button class="btn sm" onclick="verLoja('${S.me}')">🏪 Ver minha loja</button><button class="btn sm gh" onclick="shareLoja('${S.me}')">🔗 Partilhar</button></div></div>`}

function rateSeller(u){if(!S.me){alert('Entra na tua conta para avaliar.');return go('conversas')}if(u===S.me)return;if(!S.chats.some(c=>c.id===S.me+'_'+u))return alert('Só podes avaliar depois de conversar com o vendedor.');const n=parseInt(prompt('Nota de 1 a 5 estrelas?'));if(!(n>=1&&n<=5))return;S.db.collection('rate').doc(S.me+'_'+u).set({s:u,by:S.me,n,ts:Date.now()}).then(()=>alert('Obrigado pela avaliação ⭐')).catch(e=>alert('Erro: '+(e.message||e.code)))}
