<!DOCTYPE html>
<html lang="pt-AO"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZANGO 5 MARKET - Kilapi Digital da Banda</title>
<style>
:root{--bg:#fff8ef;--card:#fff;--tx:#1b2a41;--mut:#6b7a90;--or:#ff7a00;--bl:#0b4f9c;--gr:#18a957;--bd:#f0dcc0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a2b;--card:#17243a;--tx:#f4efe6;--mut:#9fb0c8;--bd:#2a3b57}}
:root[data-theme="dark"]{--bg:#101a2b;--card:#17243a;--tx:#f4efe6;--mut:#9fb0c8;--bd:#2a3b57}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:72px}
main{max-width:640px;margin:auto;padding:12px}
header{background:linear-gradient(135deg,var(--or),var(--bl));color:#fff;padding:12px 14px;text-align:center}
header b{font-size:18px;display:block}header small{opacity:.95}
.hero{background:linear-gradient(135deg,var(--or),#ffb347);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.hero h2{margin:0 0 6px;font-size:19px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:800;color:#fff;background:var(--bl);cursor:pointer;text-align:center;text-decoration:none}
.btn.or{background:var(--or)}.btn.gr{background:var(--gr)}.btn.sm{padding:8px;font-size:13px;display:inline-block;width:auto;border-radius:10px}.btn.gh{background:transparent;color:var(--bl);border:2px solid var(--bl)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}.chip{flex:none;border:2px solid var(--bl);color:var(--bl);background:transparent;border-radius:20px;padding:6px 11px;font-weight:700;font-size:13px;cursor:pointer}.chip.on{background:var(--bl);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden}.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bd)}
.card div{padding:8px}.pr{color:var(--or);font-weight:900;font-size:17px}.mut{color:var(--mut);font-size:12.5px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--bd);border-radius:10px;margin:4px 0 10px;font:inherit;background:var(--bg);color:var(--tx)}
label{font-weight:700;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:9px 2px;font-size:11.5px;font-weight:700;color:var(--mut);cursor:pointer}nav button.on{color:var(--or)}nav span{display:block;font-size:20px}
.tag{display:inline-block;background:var(--bl);color:#fff;border-radius:8px;padding:2px 7px;font-size:11px;font-weight:700}.tag.o{background:var(--or)}.tag.r{background:#d33}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.av{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none!important}
.big{font-size:28px;font-weight:900;color:var(--or)}
</style></head><body>
<header><b>🌞 ZANGO 5 MARKET</b><small>Kilapi Digital da Banda · Aqui ninguém perde, 1000Kz te faz patrão!</small></header>
<main id="app">A carregar o bazar… 🛒</main>
<nav id="nav"></nav>
<script>
const CATS=["Ngué Nguvulo (Comida) 🍲","Pano da Buala (Roupas) 👕","Babas e Mamis (Bebés) 🍼","Banga das Damas (Cabelo/Unhas) 💅","Mambos de Casa 🏠","Móveis e Eletro 🛋️","Biscates e Serviços 🔧"];
const S={view:'home',cat:-1,let:'',near:false,af:'pend',proofs:{},myB:null,apps:{},oks:{},shops:{},cfg:{},me:null,admin:false,db:null,pend:{}};
const $=s=>document.getElementById(s),esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LET='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const BL=b=>'Bloco '+esc(b);
const pb=b=>{const m=/^([A-Za-z])\s*(\d{1,3})$/.exec(String(b||'').trim());return m?{l:m[1].toUpperCase(),n:+m[2]}:null};
const mine=()=>S.myB||(S.apps[S.me]||{}).bloco;
function dist(b){const a=pb(b),m=pb(mine());if(!a||!m)return 9999;return a.l===m.l?Math.abs(a.n-m.n):500+Math.abs(a.l.charCodeAt()-m.l.charCodeAt())*10}
const lopts=sel=>LET.map(l=>`<option value="${l}" ${sel==l?'selected':''}>${l}</option>`).join('');
const kz=n=>Number(n||0).toLocaleString('pt-PT')+' Kz';
const active=u=>S.oks[u]&&S.oks[u].state==='ativo'&&S.oks[u].until>Date.now();
const wa=n=>{n=String(n).replace(/\D/g,'');return 'https://wa.me/'+(n.length==9?'244'+n:n)};
function shrink(file,max=480){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};i.src=URL.createObjectURL(file)})}
async function pick(e,k){const f=e.target.files[0];if(f){S.pend[k]=await shrink(f,k==='proof'?800:480);e.target.nextElementSibling.textContent='✅ Foto pronta!'}}
function go(v){S.view=v;render();scrollTo(0,0)}
function items(){let a=[];for(const u in S.shops)if(active(u))(S.shops[u].items||[]).filter(i=>!i.sold).forEach(i=>a.push({...i,u}));return a.sort((x,y)=>y.ts-x.ts)}
function seller(u){return S.apps[u]||{}}
function card(i){const s=seller(i.u),d=dist(s.bloco),nb=mine()?(d==0?'<span class="tag">📍 No teu bloco</span> ':d<=3?'<span class="tag o">👣 Vizinho</span> ':''):'';return `<div class="card"><img src="${esc(i.img)}" alt=""><div><div class="pr">${kz(i.p)}</div>${nb}<b>${esc(i.t)}</b><div class="mut">${esc(s.name)} - ${BL(s.bloco)} ✅</div><a class="btn gr sm" style="margin-top:6px;width:100%" href="${wa(s.wpp)}?text=${encodeURIComponent('Mboa! Vi o teu '+i.t+' no Zango 5 Market 🌞')}" target="_blank" rel="noopener">💬 Falar no WhatsApp</a></div></div>`}
function home(){let L=items().filter(i=>(S.cat<0||i.c==S.cat)&&(!S.let||(pb(seller(i.u).bloco)||{}).l===S.let)&&(!S.q||(i.t+' '+seller(i.u).name+' '+seller(i.u).sells).toLowerCase().includes(S.q)));if(S.near&&mine())L.sort((a,b)=>dist(seller(a.u).bloco)-dist(seller(b.u).bloco));const m=S.me&&S.apps[S.me];
return `<div class="hero"><h2>Cansaste de ir no Kikolo? 🛍️</h2>Vende e compra aqui no prédio! De Bloco A1 até Bloco Z200, tudo se vende aqui sem precisar apanhar táxi! Entrega a pé! 🚶</div>
${m?'':`<button class="btn or" onclick="go('join')">🔥 QUERO SER PATRÃO POR 1000KZ</button><p class="mut" style="text-align:center">Com 1000Kz nem compras um frango, mas aqui compras clientes todo mês! Investimento que volta no primeiro cliente. 🤑</p>`}
<input id="qs" placeholder="🔍 Procurar bolo, tranças, gás…" value="${esc(S.q||'')}" style="margin:0 0 8px" oninput="S.q=this.value.toLowerCase();clearTimeout(window.qt);window.qt=setTimeout(()=>{document.activeElement.blur();render();$('qs').focus()},500)"><div class="chips"><button class="chip ${S.cat<0?'on':''}" onclick="S.cat=-1;render()">Tudo 🔥</button>${CATS.map((c,i)=>`<button class="chip ${S.cat==i?'on':''}" onclick="S.cat=${i};render()">${c}</button>`).join('')}</div>
<div class="row" style="margin-bottom:8px"><select style="margin:0" onchange="this.blur();S.let=this.value;render()"><option value="">Todos os blocos</option>${LET.map(l=>`<option value="${l}" ${S.let==l?'selected':''}>Todos os Bloco ${l}</option>`).join('')}</select><button class="chip ${S.near?'on':''}" onclick="S.near=!S.near;render()">📍 Perto de mim</button></div>
${S.near&&!mine()?`<div class="box row"><select id="m_l" style="margin:0">${lopts('A')}</select><input id="m_n" type="number" min="1" max="200" placeholder="1-200" style="margin:0"><button class="btn sm" onclick="setMy()">OK</button></div>`:S.near?`<p class="mut">Primeiro os do ${BL(mine())} e vizinhos 👣</p>`:''}
<div class="grid">${L.map(card).join('')||'<p class="mut" style="grid-column:1/3">Ainda está calmo por aqui, mano. Sê o primeiro patrão a postar! 😎</p>'}</div><p style="text-align:center;margin-top:24px"><a href="#" class="mut" onclick="go('admin');return false">🔒 Área do admin</a></p>`}
function setMy(){const n=+$('m_n').value;if(!(n>=1&&n<=200))return alert('Número de 1 a 200, mano!');S.myB=$('m_l').value+n;document.activeElement.blur();render()}
function loginBox(){return `<div class="box"><b>Entra no teu painel 🔑</b><p class="mut">Número + PIN de 6 dígitos, sem SMS. Para comprar não precisa de entrar.</p><label>Telemóvel</label><input id="l_t" type="tel" placeholder="9XX XXX XXX"><label>PIN (6 números)</label><input id="l_p" type="password" inputmode="numeric" maxlength="6"><button class="btn" onclick="doLogin(0)">Entrar</button><hr style="border:0;border-top:1px solid var(--bd);margin:14px 0"><b>Primeira vez? 🆕</b><label>Repete o PIN</label><input id="l_p2" type="password" inputmode="numeric" maxlength="6"><button class="btn or" onclick="doLogin(1)">Criar a minha conta</button><p class="mut">Guarda bem o PIN! Se esqueceres, fala com o admin no WhatsApp.</p></div>`}
async function doLogin(nova){let t=$('l_t').value.replace(/\D/g,'');if(t.length==9)t='244'+t;const p=$('l_p').value;if(t.length<9||!/^\d{6}$/.test(p))return alert('Põe o teu número e um PIN de 6 números, mano!');if(nova&&p!==$('l_p2').value)return alert('Os dois PINs não são iguais 🤔');
try{await FB.login(t,p,nova)}catch(e){alert({'auth/email-already-in-use':'Esse número já tem conta. Usa o botão Entrar.','auth/invalid-credential':'Número ou PIN errado.','auth/operation-not-allowed':'O admin ainda não ativou Email/Senha no Firebase.','auth/too-many-requests':'Muitas tentativas. Espera uns minutos.'}[e.code]||'Erro: '+(e.code||e.message))}}
function join(){const m=S.apps[S.me],o=S.oks[S.me];
if(!S.me)return loginBox();
if(m)return `<div class="box"><b>Já mandaste os dados, ${esc(m.name)}! 🙌</b><p>${o&&o.state==='ativo'&&o.until>Date.now()?'Estás ATIVO ✅ Vai ao teu painel e posta!':o&&o.state==='recusado'?'O admin não aprovou o comprovativo. Fala com ele no WhatsApp.':'Estamos a confirmar o teu pagamento. Calma que já já és patrão ⏳'}</p><button class="btn" onclick="go('painel')">Ir ao meu painel</button></div>`;
return `<div class="box"><h3 style="margin-top:0">Vira patrão por 1000Kz/mês 💪</h3>
<label>Teu nome</label><input id="f_n"><label>Bloco (letra + número de 1 a 200)</label><div class="row"><select id="f_bl">${lopts('A')}</select><input id="f_bn" type="number" min="1" max="200" inputmode="numeric" placeholder="ex: 45"></div>
<label>Apartamento</label><input id="f_a" placeholder="ex: 3º andar, porta 12"><label>WhatsApp</label><input id="f_w" type="tel" placeholder="9XX XXX XXX">
<label>O que vendes?</label><input id="f_s" placeholder="ex: bolos, tranças, gás…"><label>Foto de perfil</label><input type="file" accept="image/*" onchange="pick(event,'photo')"><div class="mut"></div><br>
<div class="box" style="background:var(--bg)"><b>💳 Pagamento: 1.000 Kz</b><br>Multicaixa Express para: <b>${esc(S.cfg.num||'(o admin ainda vai pôr o número)')}</b> ${S.cfg.nome?'('+esc(S.cfg.nome)+')':''}<br><span class="mut">Paga e anexa o comprovativo aqui em baixo.</span></div>
<label>Comprovativo (print)</label><input type="file" accept="image/*" onchange="pick(event,'proof')"><div class="mut"></div><br>
<button class="btn or" onclick="sendJoin()">Mandar e esperar aprovação 🚀</button></div>`}
async function sendJoin(){const g=i=>$(i).value.trim();if(!g('f_n')||!g('f_w')||!g('f_s')||!S.pend.photo||!S.pend.proof)return alert('Falta qualquer coisa, mano! Preenche tudo e põe as 2 fotos 📸');
const bn=+g('f_bn');if(!(bn>=1&&bn<=200))return alert('O número do bloco é de 1 a 200, mano!');const bk=g('f_bl')+bn;try{await S.db.collection('apps').doc(S.me).set({name:g('f_n'),bloco:bk,apt:g('f_a'),wpp:g('f_w'),sells:g('f_s'),photo:S.pend.photo,ts:Date.now()});await S.db.collection('proofs').doc(S.me).set({img:S.pend.proof,ts:Date.now()});S.pend={};go('painel')}catch(e){alert('Deu erro: '+(e.message||e.code))}}
function painel(){const m=S.apps[S.me];if(!S.me)return loginBox();if(!m)return `<div class="box"><b>Ainda não és patrão 😅</b><button class="btn or" onclick="go('join')" style="margin-top:8px">Cadastrar agora</button></div>`;
const it=(S.shops[S.me]||{}).items||[],sold=it.filter(i=>i.sold),tot=sold.reduce((a,i)=>a+Number(i.p),0),ok=active(S.me);
return `<div class="box row"><img class="av" src="${esc(m.photo)}" alt=""><div><b>${esc(m.name)}</b> · ${BL(m.bloco)}<br>${ok?'<span class="tag">✅ Vendedor Confirmado do Zango 5</span> <span class="mut">até '+new Date(S.oks[S.me].until).toLocaleDateString('pt-PT')+'</span>':'<span class="tag o">⏳ À espera de aprovação</span>'}</div></div>
<div class="box"><div class="mut">Calculadora ganha-ganha 🧮</div><div class="big">${(tot/1000).toFixed(1)}x</div>Já vendeste ${kz(tot)}${tot>=1000?`, ou seja, já lucraste <b>${Math.floor(tot/1000)} vezes</b> os 1000Kz! Mamo total! 🤑`:'. Faz a primeira venda e o teu investimento já volta! 💪'}</div>
${ok?`<div class="box"><b>Novo produto 📦</b><label>Nome</label><input id="p_t"><label>Preço (Kz)</label><input id="p_p" type="number" inputmode="numeric"><label>Categoria</label><select id="p_c">${CATS.map((c,i)=>`<option value="${i}">${c}</option>`).join('')}</select><label>Foto</label><input type="file" accept="image/*" onchange="pick(event,'prod')"><div class="mut"></div><br><button class="btn gr" onclick="addP()">Postar no bazar 🔥</button></div>`:''}
<div class="box"><b>Meus produtos</b>${it.map(i=>`<div class="row" style="margin:8px 0"><img class="av" src="${esc(i.img)}" alt=""><div><b>${esc(i.t)}</b><br>${kz(i.p)} ${i.sold?'<span class="tag">VENDIDO ✅</span>':''}</div>${i.sold?'':`<button class="btn sm gr" onclick="mark('${i.id}')">Vendi!</button>`}<button class="btn sm gh" onclick="del('${i.id}')">🗑️</button></div>`).join('')||'<p class="mut">Nada postado ainda.</p>'}</div><button class="btn sm gh" onclick="FB.out()">Sair da conta</button>`}
async function saveItems(a){try{await S.db.collection('shop').doc(S.me).set({items:a})}catch(e){alert('Erro: '+(e.message||e.code))}}
function addP(){const t=$('p_t').value.trim(),p=$('p_p').value;if(!t||!p||!S.pend.prod)return alert('Põe nome, preço e foto, mano 📸');const a=[...((S.shops[S.me]||{}).items||[]),{id:'p'+Date.now(),t,p:Number(p),c:+$('p_c').value,img:S.pend.prod,ts:Date.now()}];if(JSON.stringify(a).length>900000)return alert('Muitos produtos! Apaga os vendidos, mano 🙂');S.pend.prod=null;saveItems(a)}
function mark(id){saveItems(((S.shops[S.me]||{}).items||[]).map(i=>i.id==id?{...i,sold:true,sts:Date.now()}:i))}
function del(id){if(confirm('Apagar mesmo?'))saveItems(((S.shops[S.me]||{}).items||[]).filter(i=>i.id!=id))}
function rank(){const wk=Date.now()-6048e5,L={};for(const u in S.shops){if(!active(u))continue;const n=(S.shops[u].items||[]).filter(i=>i.sold&&i.sts>wk).length,s=seller(u),p=pb(s.bloco),k=p?p.l:'?';if(n){(L[k]=L[k]||{t:0,v:[]}).t+=n;L[k].v.push([s.name,s.bloco,n])}}
const med=['🥇','🥈','🥉'],E=Object.entries(L).sort((a,b)=>b[1].t-a[1].t);
return `<h3>🏆 Ranking da semana</h3><p class="mut">Top Vendedores por Letra: quem manda no Bloco A, no Bloco B… 😎</p>${E.map(([k,o],i)=>`<div class="box"><div class="row"><b>${med[i]||i+1+'º'} Bloco ${esc(k)}</b><b style="text-align:right">${o.t} vendas</b></div>${o.v.sort((a,b)=>b[2]-a[2]).slice(0,3).map((v,j)=>`<div class="row" style="margin:6px 0"><span>${med[j]||''} ${esc(v[0])} (${BL(v[1])})</span><b style="text-align:right">${v[2]}</b></div>`).join('')}</div>`).join('')||'<p class="mut">Ninguém vendeu ainda esta semana. Quem vai abrir o placar? 😏</p>'}`}
function admBox(){return `<div class="box"><b>🔒 Área restrita do admin</b><p class="mut">Só o patrão-mor entra aqui, com e-mail e senha forte.</p><label>E-mail</label><input id="a_e" type="email" autocomplete="username"><label>Senha</label><input id="a_p" type="password" autocomplete="current-password"><button class="btn" onclick="admLogin()">Entrar como admin</button>${S.me?'<p class="mut">Esta sessão não é de admin.</p><button class="btn sm gh" onclick="FB.out()">Sair da conta</button>':''}</div>`}
async function admLogin(){try{await FB.adminLogin($('a_e').value.trim(),$('a_p').value)}catch(e){alert('E-mail ou senha errados.')}}
function admin(){if(!S.admin)return admBox();
const L=Object.entries(S.apps).sort((a,b)=>b[1].ts-a[1].ts),L0=L.filter(x=>S.af=='todos'||(S.af=='ativo'?active(x[0]):!active(x[0])));
return `<h3>👑 Painel Admin <button class="btn sm gh" onclick="FB.out()">Sair</button></h3><div class="box"><b>Dados de pagamento</b><label>Nº Multicaixa Express</label><input id="c_n" value="${esc(S.cfg.num||'')}"><label>Nome do titular</label><input id="c_t" value="${esc(S.cfg.nome||'')}"><button class="btn sm" onclick="saveCfg()">Guardar</button></div>
<div class="box row" style="text-align:center"><div><div class="big">${L.filter(x=>active(x[0])).length}</div>ativos</div><div><div class="big">${L.filter(x=>!S.oks[x[0]]).length}</div>por aprovar</div><div><div class="big" style="font-size:18px">${kz(L.filter(x=>active(x[0])).length*1000)}</div>este mês</div></div><div class="chips">${[['pend','Por aprovar / expirados'],['ativo','Ativos'],['todos','Todos']].map(c=>`<button class="chip ${S.af==c[0]?'on':''}" onclick="S.af='${c[0]}';render()">${c[1]}</button>`).join('')}</div>
${L0.map(([u,a])=>{const o=S.oks[u],st=active(u)?'<span class="tag">ATIVO</span>':o&&o.state==='recusado'?'<span class="tag r">RECUSADO</span>':o?'<span class="tag r">EXPIRADO</span>':'<span class="tag o">PENDENTE</span>';
return `<div class="box"><div class="row"><img class="av" src="${esc(a.photo)}" alt=""><div><b>${esc(a.name)}</b> ${st}<br><span class="mut">${BL(a.bloco)} ${esc(a.apt)} · ${esc(a.sells)}</span><br><a href="${wa(a.wpp)}" target="_blank" rel="noopener">📱 ${esc(a.wpp)}</a></div></div>
<details><summary>Ver comprovativo 🧾</summary><img src="${esc((S.proofs[u]||{}).img)}" style="width:100%;border-radius:10px;margin-top:6px" alt=""></details><br>
<button class="btn sm gr" onclick="approve('${u}',1)">✅ Aprovar 30 dias</button> <button class="btn sm gh" onclick="approve('${u}',0)">❌ Recusar</button></div>`}).join('')||'<p class="mut">Ainda sem cadastros.</p>'}`}
function approve(u,y){const o=S.oks[u],base=o&&o.until>Date.now()?o.until:Date.now();S.db.collection('ok').doc(u).set(y?{state:'ativo',until:base+30*864e5}:{state:'recusado',until:0}).catch(e=>alert('Erro: '+(e.message||e.code)))}
function saveCfg(){S.db.collection('cfg').doc('pay').set({num:$('c_n').value.trim(),nome:$('c_t').value.trim()}).then(()=>alert('Guardado ✅'))}
function render(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=='file')return;
$('app').innerHTML={home,join,painel,rank,admin}[S.view==='ranking'?'rank':S.view]();
const T=[['home','🏠','Bazar'],['ranking','🏆','Ranking'],['painel','🧑‍💼','Meu painel']];if(S.admin)T.push(['admin','👑','Admin']);
$('nav').innerHTML=T.map(t=>`<button class="${S.view==t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}
window.boot=()=>{S.db=FB.db;render();const w=(n,f)=>S.db.collection(n).onSnapshot(s=>{f(s);render()},()=>{});
w('apps',s=>{S.apps={};s.docs.forEach(d=>S.apps[d.id]=d.data())});w('ok',s=>{S.oks={};s.docs.forEach(d=>S.oks[d.id]=d.data())});
